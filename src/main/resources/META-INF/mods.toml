modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="cnpccombat"
version="1.1.0"
displayName="CNPC BetterCombat"
displayURL="https://space.bilibili.com/353609880"
authors="Bin"
description='''Makes CustomNPCs entities use Better Combat attack and weapon pose animations like players.'''

# 基础依赖
[[dependencies.cnpccombat]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.cnpccombat]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# BetterCombat 前置
[[dependencies.cnpccombat]]
    modId="bettercombat"
    mandatory=true
    versionRange="[1,2)"
    ordering="AFTER"
    side="BOTH"

# playerAnimator 前置
[[dependencies.cnpccombat]]
    modId="playeranimator"
    mandatory=true
    versionRange="[1,2)"
    ordering="AFTER"
    side="BOTH"

# CustomNPCs 依赖
[[dependencies.cnpccombat]]
    modId="customnpcs"
    mandatory=true
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"

# YSM（是，史蒂夫模型）——**可选**依赖。
# mandatory=false：没装也能正常启动，YSM 相关按钮不显示、渲染回退到 CNPC 原生。
# ordering="AFTER"：保证 YSM 先加载完，我们的 isLoaded 探测才有意义。
# side="CLIENT"：模型渲染纯客户端行为，服务端不需要 YSM
#（模型名走 CNPC 原生 DataDisplay 同步，服务端只存字符串，不碰 YSM 类）。
[[dependencies.cnpccombat]]
    modId="yes_steve_model"
    mandatory=false
    versionRange="[2,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
    config="mixins.cnpccombat.json"
