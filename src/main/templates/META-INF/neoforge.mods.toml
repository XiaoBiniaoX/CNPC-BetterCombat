modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Makes CustomNPCs entities use Better Combat attack and weapon pose animations like players.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="bettercombat"
    type="required"
    versionRange="[2.3.2,2.5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    type="required"
    versionRange="[2.0.4,3)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="customnpcs"
    type="required"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
